<nav class="sidebar">
  <div class="top-icon">
    <span class="emoji">💹</span>
  </div>

  <ul>
    <li *ngFor="let page of pages">
      <a [routerLink]="page.route" routerLinkActive="active">
        <span class="emoji">{{ page.emoji }}</span>
        <span class="label">{{ page.name }}</span>
      </a>
    </li>
  </ul>
</nav>
