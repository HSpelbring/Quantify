<nav class="navbar" [class.expanded]="expanded">
  <div class="nav-items">
    <a *ngFor="let page of pages" [routerLink]="page.route" class="nav-link" routerLinkActive="active">
      <div class="nav-icon" [attr.data-icon]="page.icon"></div>
      <span *ngIf="expanded" class="nav-label">{{ page.name }}</span>
    </a>
  </div>
</nav>
