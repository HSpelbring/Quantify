<nav class="sidebar">
  <div class="top-icon">
    <img src="/assets/images/logo.png" alt="Logo"
      style="width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; filter: brightness(1.2);" />
  </div>

  <ul>
    <li *ngFor="let page of pages">
      <a [routerLink]="page.route" routerLinkActive="active">
        <img [src]="'/assets/images/' + page.icon" [alt]="page.name" class="nav-icon" />
        <span class="label">{{ page.name }}</span>
      </a>
    </li>
  </ul>
</nav>
