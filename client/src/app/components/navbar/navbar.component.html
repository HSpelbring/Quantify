<nav class="sidebar">
  <div class="top-icon">☰</div>

  <ul>
    <li *ngFor="let page of pages">
      <a [routerLink]="page.route" routerLinkActive="active">
        <img
          [src]="'/assets/images/' + page.icon"
          [alt]="page.name"
          class="nav-icon"
        />
        <span class="label">{{ page.name }}</span>
      </a>
    </li>
  </ul>
</nav>
