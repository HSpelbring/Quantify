<div class="dashboard">
  <!-- Notification Banner -->
  <div class="notification-banner" *ngIf="notifications.length > 0">
    <div *ngFor="let note of notifications" class="banner-item">
      <div class="banner-content">
        <span class="banner-icon">🔔</span>
        <span class="banner-message">{{ note.message }}</span>
      </div>
      <button class="banner-close" (click)="dismissNotification(note.id)">✕</button>
    </div>
  </div>

  <!-- Right-side stack -->
  <div class="right-side">

    <div class="portfolio-box box">
      <h2>Portfolio Overview</h2>
      <div class="price">
        <span class="amount">{{ portfolio.price | currency:'USD' }}</span>
        <span class="change" [class.up]="portfolio.change > 0" [class.down]="portfolio.change < 0">
          {{ portfolio.change > 0 ? '+' : '' }}{{ portfolio.change }}%
        </span>
      </div>

      <canvas id="portfolioChart"></canvas>
    </div>

    <!-- Today's Signals -->
    <div class="signals-box box">
      <h2>Today's Signals</h2>
      <div class="signal-list">
        <div class="signal-row" *ngFor="let signal of signals" (click)="onSignalClick(signal)">
          <div class="signal-indicator" [ngClass]="signal.type"></div>
          <span class="signal-text">{{ signal.text }}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="fund-ticker">
    <div class="ticker-track">
      <ng-container *ngFor="let repeat of [0,1,2]">
        <div class="fund" *ngFor="let fund of funds; let i = index">
          <div class="fund-row">
            <div class="fund-left">
              <div class="fund-symbol">{{ fund.symbol }}</div>
              <div class="fund-name">{{ fund.name }}</div>
            </div>
            <canvas class="fund-chart" [id]="'fundChart' + repeat + '_' + i" width="70" height="30"></canvas>
            <div class="fund-right">
              <div class="fund-price" [class.up]="fund.change > 0" [class.down]="fund.change < 0">
                {{ fund.price | currency:'USD' }}
              </div>
              <div class="fund-change" [class.up]="fund.change > 0" [class.down]="fund.change < 0">
                {{ fund.change > 0 ? '▲' : '▼' }} {{ fund.change }}%
              </div>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
